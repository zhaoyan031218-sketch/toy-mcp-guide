<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toy Control</title>
</head>
<body style="background:#1a1a1a;color:#f5c6a0;text-align:center;
            padding-top:10vh;font-family:sans-serif;">

<!-- 密码门 -->
<div id="gate">
  <h1>🔒 请输入访问密码</h1>
  <input id="pwInput" type="password" autocomplete="current-password"
      style="padding:12px 16px;font-size:18px;border:none;border-radius:8px;
             text-align:center;background:#2a2a2a;color:#f5c6a0;">
  <br><br>
  <button id="pwBtn" style="padding:12px 32px;font-size:18px;
      background:#f5c6a0;color:#1a1a1a;border:none;border-radius:8px;">
    进入
  </button>
  <p id="pwMsg" style="color:#e07a7a;min-height:1.2em;"></p>
</div>

<!-- 主界面 -->
<div id="main" style="display:none;">
  <h1 id="status">点击「扫描」连接设备</h1>
  <button id="scanBtn" style="padding:16px 32px;font-size:18px;
      background:#f5c6a0;color:#1a1a1a;border:none;border-radius:8px;">
    🔍 扫描新设备
  </button>
  <div id="devList"></div>
</div>

<script>
let TOY_KEY = localStorage.getItem('toy_key') || '';
function stateUrl() { return '/state?key=' + encodeURIComponent(TOY_KEY); }

function showMain() {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('main').style.display = 'block';
}
function showGate(msg) {
    document.getElementById('gate').style.display = 'block';
    document.getElementById('main').style.display = 'none';
    document.getElementById('pwMsg').textContent = msg || '';
}

async function tryUnlock(key) {
    try {
        const res = await fetch('/state?key=' + encodeURIComponent(key));
        if (res.ok) {
            TOY_KEY = key;
            localStorage.setItem('toy_key', key);
            showMain();
            return true;
        }
    } catch(e) {}
    return false;
}

document.getElementById('pwBtn').addEventListener('click', async () => {
    const key = document.getElementById('pwInput').value;
    if (!(await tryUnlock(key))) {
        document.getElementById('pwMsg').textContent = '密码错误，请重试';
    }
});
document.getElementById('pwInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('pwBtn').click();
});

/* 自动用上次保存的密码解锁 */
tryUnlock(TOY_KEY).then(ok => { if (!ok) showGate(); });

window.devices = [];
let lastUpdatedAt = 0;

/* Map 0-100 strength to BLE intensity (0-255) with perceptible steps */
function mapIntensity(v) {
    if (v <= 0) return 0;
    if (v <= 20) return 50;   // gentle
    if (v <= 40) return 100;  // moderate
    if (v <= 60) return 160;  // strong
    if (v <= 80) return 210;  // very strong
    return 255;               // maximum
}

async function sendAll(intensity) {
    const i = mapIntensity(intensity);
    /* Svakom protocol: CMD 0x55 0x04, mode 0x01, intensity byte, end byte 0xAA */
    const data = new Uint8Array([0x55, 0x04, 0x00, 0x00, 0x01, i, 0xAA]);
    for (const d of window.devices) {
        try { await d.writeChar.writeValue(data); } catch(e) {}
    }
}
async function stopAll() {
    const data = new Uint8Array([0x55, 0x04, 0x00, 0x00, 0x00, 0x00, 0xAA]);
    for (const d of window.devices) {
        try { await d.writeChar.writeValue(data); } catch(e) {}
    }
}

async function connectOne() {
    document.getElementById('status').textContent = '扫描中...';
    const device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: ['0000ffe0-0000-1000-8000-00805f9b34fb']
    });
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
    const chars = await service.getCharacteristics();
    let wc = null;
    for (const c of chars) {
        if (c.properties.writeWithoutResponse || c.properties.write) {
            wc = c; break;
        }
    }
    const entry = { name: device.name, writeChar: wc, device };
    window.devices.push(entry);
    device.addEventListener('gattserverdisconnected', () => {
        window.devices = window.devices.filter(d => d.device !== device);
        updateUI();
    });
    updateUI();
}

function updateUI() {
    const n = window.devices.length;
    document.getElementById('status').textContent =
        n > 0 ? '已连接 ' + n + ' 个设备' : '全部断开 - 点击重连';
    document.getElementById('status').style.color = n > 0 ? '#7ec87e' : '#f5c6a0';
}

document.getElementById('scanBtn').addEventListener('click', connectOne);

let lastCmd = null;
setInterval(async () => {
    if (window.devices.length === 0) return;
    try {
        const res = await fetch(stateUrl());
        if (res.status === 403) {
            /* 密码被修改，回到密码门 */
            localStorage.removeItem('toy_key');
            showGate('密码已失效，请重新输入');
            return;
        }
        const state = await res.json();
        if (state.updated_at > lastUpdatedAt) {
            lastUpdatedAt = state.updated_at;
            if (state.cmd === 'stop') { lastCmd = null; await stopAll(); }
            else if (state.cmd === 'set') {
                lastCmd = state.intensity || 0;
                await sendAll(lastCmd);
            }
        }
    } catch(e) {}
}, 1000);

/* Periodic keep-alive resend */
setInterval(async () => {
    if (lastCmd !== null && window.devices.length > 0) {
        await sendAll(lastCmd);
    }
}, 1400);
</script>
</body>
</html>
